spring.application.name=adventit-backend
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./adventit.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
app.auth.jwt-secret=${AUTH_JWT_SECRET:TestingTokenTestingTokenTestingTokenTestingTokenTestingTokenTestingTokenTestingToken}
app.auth.jwt-expiration=${AUTH_JWT_EXPIRATION:PT1H}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.google.routes.api-key=${GOOGLE_ROUTES_API_KEY:}
app.google.routes.endpoint=${GOOGLE_ROUTES_API_ENDPOINT:https://routes.googleapis.com/directions/v2:computeRoutes}
app.qwen.ollama.endpoint=${QWEN_OLLAMA_ENDPOINT:http://localhost:11434/api/chat}
app.qwen.model=${QWEN_MODEL:qwen2.5:3b}
