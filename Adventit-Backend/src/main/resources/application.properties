spring.application.name=adventit-backend
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./adventit.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
app.auth.jwt-secret=${AUTH_JWT_SECRET}
app.auth.jwt-expiration=${AUTH_JWT_EXPIRATION:PT1H}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
